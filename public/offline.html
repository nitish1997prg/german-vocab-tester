
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#176B63" />

    <title>You're Offline — German Vocabulary Tester</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3f8f5;
        color: #1f2937;
        font-family: Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        border-radius: 20px;
        background: white;
        text-align: center;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }

      p {
        color: #647067;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      a {
        display: block;
        padding: 16px 24px;
        border-radius: 12px;
        background: #176b63;
        color: white;
        font-weight: bold;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #176b63;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="icon" aria-hidden="true">📶</div>

      <h1>You're offline!</h1>

      <p>
        Keine Verbindung!
        <br />
        No internet connection.

        <br /><br />

        Connect to the internet to generate
        your German vocabulary questions.
      </p>

      <a href="/">Try Again</a>
    </main>
  </body>
</html>
